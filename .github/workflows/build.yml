name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name my_tracker --org com.ahmed.tracker .

      - name: Arabic app name
        run: sed -i 's/android:label="[^"]*"/android:label="أدواتي"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: my-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
